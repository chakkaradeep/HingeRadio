name: HingeRadio
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.1"
packages:
  RadioCore:
    path: Packages/RadioCore
targets:
  HingeRadio:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RadioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HingeRadio
        SWIFT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The one source of Info.plist keys: XcodeGen writes App/Info.plist from this block.
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # Lets the wheels, the needle and the glides draw at 120 frames a second on ProMotion.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            nap.casthost.net:
              NSExceptionAllowsInsecureHTTPLoads: true
            stream.pacificaservice.org:
              NSExceptionAllowsInsecureHTTPLoads: true
            stream.wbai.org:
              NSExceptionAllowsInsecureHTTPLoads: true
            wmxm.streamguys1.com:
              NSExceptionAllowsInsecureHTTPLoads: true
            webcast.wonc.org:
              NSExceptionAllowsInsecureHTTPLoads: true
            wdcb-ice.streamguys.org:
              NSExceptionAllowsInsecureHTTPLoads: true
            stations.pacifica.org:
              NSExceptionAllowsInsecureHTTPLoads: true
